# Descarga diariamente los conteos de eventos de GoatCounter (API oficial) y los guarda en stats/.
# Requiere el secreto GOATCOUNTER_TOKEN (clave de API de GoatCounter con permiso de lectura de estadísticas).
name: Estadísticas diarias
on:
  schedule:
    - cron: "17 12 * * *"   # todos los días, 06:17 hora de México
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar conteos
        env:
          GC_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, datetime, pathlib
          p = pathlib.Path("stats"); p.mkdir(exist_ok=True)
          tok = os.environ.get("GC_TOKEN", "")
          base = "https://contratoauto.goatcounter.com/api/v0"
          start = "2026-10-08T00:00:00Z"
          end = (datetime.datetime.utcnow() + datetime.timedelta(days=1)).strftime("%Y-%m-%dT00:00:00Z")
          log = {"actualizado": datetime.datetime.utcnow().isoformat() + "Z", "token_presente": bool(tok), "llamadas": []}
          def get(path):
              req = urllib.request.Request(base + path, headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      body = r.read().decode()
                      log["llamadas"].append({"ruta": path, "estado": r.status})
                      return json.loads(body)
              except urllib.error.HTTPError as e:
                  log["llamadas"].append({"ruta": path, "estado": e.code, "error": e.read().decode()[:2000]})
                  return None
          total = get(f"/stats/total?start={start}&end={end}")
          hits, more, after = [], True, None
          for _ in range(30):
              q = f"/stats/hits?start={start}&end={end}&limit=100" + (f"&exclude_paths={after}" if after else "")
              d = get(q)
              if not d: break
              hits += d.get("hits", [])
              if not d.get("more"): break
              after = ",".join(str(h.get("path_id")) for h in hits)
          out = {"actualizado": log["actualizado"], "desde": start, "hasta": end, "total": total,
                 "eventos": {h.get("path"): h.get("count") for h in hits}, "crudo": hits}
          (p / "eventos.json").write_text(json.dumps(out, ensure_ascii=False, indent=1))
          (p / "registro.json").write_text(json.dumps(log, ensure_ascii=False, indent=1))
          print(len(hits), "rutas")
          PY
      - name: Guardar en el repositorio
        run: |
          git config user.name "estadisticas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add stats/
          git diff --cached --quiet || git commit -m "Estadísticas $(date -u +%F)"
          git push
